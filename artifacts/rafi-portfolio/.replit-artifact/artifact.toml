kind = "web"
previewPath = "/"
title = "Rafi Ariq Maulana — Portfolio"
description = "A responsive three-page portfolio for digital marketer and content creator Rafi Ariq Maulana, featuring services, selected work, a contact form, and live WIB clocks."
version = "1.0.0"
id = "artifacts/rafi-portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19435

[services.development]
run = "pnpm --filter @workspace/rafi-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/rafi-portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/rafi-portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19435"
BASE_PATH = "/"
